apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
spec:
  
  schedule: "5 19 * * *"   # todo dia às 02:00
  timeZone: "America/Sao_Paulo"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: mysql:8.0
            env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD
            command:
              - sh
              - -c
              - |
                echo "Iniciando backup..."
                mysqldump -h mysql -u$DB_USER -p$DB_PASSWORD \
                  --all-databases \
                  > /backup/mysql-$(date +%F).sql
                echo "Backup finalizado"
            volumeMounts:
            - name: backup-volume
              mountPath: /backup
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: mysql-backup-pvc
