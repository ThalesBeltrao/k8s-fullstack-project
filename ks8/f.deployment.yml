apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        role: worker
      containers:
      - name: frontend
        image: thaleswillianbeltrao17/app-frontend:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
